# ==============================================================================
# workflow.ai.yml - the AI workflow for apsw-site (https://apsw.pl)
#
# The single source for the rules every agent in this repository follows: Claude Code, Antigravity,
# Gemini and anything else. No agent toolchain loads this file by itself, so what it says reaches
# agents through generated files, and what it claims is checked by scripts:
#
#   AGENTS.md cycle block, GEMINI.md,     generated by scripts/sync-agent-docs.mjs
#   .agents/rules/workflow_cycle.md
#   .claude/skills/                       generated by scripts/sync-claude-skills.mjs
#   the claims below about the repo       checked by scripts/check-workflow.mjs
#   the site itself                       checked by scripts/check-site.mjs
#
# Everything here is one of two kinds, and the file does not blur them:
#
#   enforced   a hook, a CI job or a script fails when it is broken: `quality_gates`, `ci`, the skill
#              registry, `agents.max_chars`, and each rule whose `enforced_by` names a script.
#   guidance   what an agent is expected to do, with nothing that fails when it does not: `tracks`,
#              `stages`, and every rule whose `enforced_by` says "review".
#
# Do not add a setting that reads as configuration but that nothing reads. If a step matters enough
# to state as a setting, give it a check; otherwise write it as guidance.
#
# Edit this file, then run `npm run sync`. Never the other way around.
# ==============================================================================

version: "1.0"
name: apsw-site
description: "The APSW business website (apsw.pl): one static bilingual page, vanilla CSS and JS, and a single PHP contact endpoint."

# ------------------------------------------------------------------------------
# 0. Governance & Precedence
# ------------------------------------------------------------------------------
governance:
  authority: "workflow.ai.yml is the supreme instruction source for every agent working in this repository. Where any other document disagrees with it, this file wins, and the other document is a defect to be fixed rather than a rule to be followed."
  precedence:
    - "workflow.ai.yml - supreme. Tracks, stages, the skill registry, quality gates and architectural rules are defined here and nowhere else."
    - ".agents/rules/** , .agents/workflows/** and .agents/skills/** - binding detail where they describe this site. Several were inherited from a Symfony + React project; where they describe api/, web/, Doctrine, Mercure, MUI, PHPUnit or Playwright, they do not apply here (see `inherited_guidance`)."
    - "AGENTS.md - loaded automatically by AGENTS.md-aware agents. Its cycle section is generated from this file; never hand-edit the generated block."
    - "GEMINI.md - generated, carries no rule of its own, and imports AGENTS.md."
    - "CLAUDE.md - Claude Code entry point. Imports AGENTS.md and may add tool-specific notes, never overrides."
  conflict_resolution: "Stop. Correct the subordinate document, run `npm run sync`, then continue. Never settle a conflict by following the subordinate text."
  sync_commands:
    - "node scripts/sync-agent-docs.mjs"
    - "node scripts/sync-claude-skills.mjs"

# Files under .agents/ copied from another project. They stay for the parts that carry over (review
# discipline, anti-slop design doctrine, debugging method). Each listed file starts with a banner
# saying it does not describe this repository; scripts/check-workflow.mjs checks the banner is there.
inherited_guidance:
  banner: "Inherited from another project"
  files:
    - ".agents/rules/backend.md"
    - ".agents/rules/database.md"
    - ".agents/workflows/create_addon.md"
    - ".agents/workflows/database_migration.md"
    - ".agents/workflows/qa_e2e.md"

# ------------------------------------------------------------------------------
# 1. Facts about the repository (enforced: scripts/check-workflow.mjs)
# ------------------------------------------------------------------------------
project:
  architecture: "Static site. index.html is the only page; css/ and js/ are loaded as-is with no bundler; js/i18n.js holds every visible string in EN and PL (const APSW_TRANSLATIONS); contact.php is the only server code."
  runtime:
    node: ">=22"
    php: "8.2"
  build_step: false
  runtime_dependencies: 0
  hosting: "Apache + PHP 8.2 (Dockerfile, docker-compose.yml) or shared cPanel hosting; files are served exactly as committed."
  machine_readable: ["agent.json", "llms.txt", "llms-full.txt", "sitemap.xml", "robots.txt"]

# ------------------------------------------------------------------------------
# 2. Agents (enforced: scripts/check-workflow.mjs holds each loaded file under max_chars)
# ------------------------------------------------------------------------------
# A file is held to the smallest limit among the agents that load it. `max_chars: 0` means no limit
# is enforced, not that none exists. "documented" is the vendor's page; nothing marked so has been
# run in this repository.
agents:
  - id: antigravity
    loads: ["AGENTS.md", "GEMINI.md", ".agents/rules/*.md"]
    skills: ".agents/skills"
    max_chars: 12000
    source: "https://antigravity.google/docs/rules-workflows/ (the limit is per rules file; AGENTS.md counted as one, reported by a third party)"
    verified: "documented 2026-09-15"
  - id: claude_code
    loads: ["CLAUDE.md", "AGENTS.md"]
    skills: ".claude/skills"
    max_chars: 0
    source: "CLAUDE.md imports AGENTS.md; skills are the generated pointers in .claude/skills"
    verified: "not tested in this repository; same layout as apsw-gridwright, tested there 2026-10-01"
  - id: gemini_cli
    loads: ["GEMINI.md"]
    skills: ""
    max_chars: 0
    source: "GEMINI.md imports AGENTS.md with @AGENTS.md; no size limit found"
    verified: "not tested"

# ------------------------------------------------------------------------------
# 3. Tracks: which stages a change goes through (guidance; the trailer is enforced, see 3b)
# ------------------------------------------------------------------------------
tracks:
  - id: content
    when: "Anything a visitor or a crawler would notice: new or changed copy, a section, markup, styling, script behaviour, or the machine-readable files (agent.json, llms*.txt, sitemap.xml, JSON-LD)."
    stages: [plan, implement, verify, review_ship]
    deliverables:
      - "every new visible string as an EN and a PL key in js/i18n.js"
      - "agent.json, llms.txt, llms-full.txt and the JSON-LD updated when the offer they describe changed"
      - "sitemap.xml lastmod moved when a listed URL changed"
  - id: fix
    when: "Restores behaviour or content that is already on the site: a broken anchor, a missing translation, a layout bug, a contact form failure. No new section, no new claim."
    stages: [implement, verify, review_ship]
    deliverables:
      - "the reproduction in the commit or pull request body, and how the fix was checked"
  - id: chore
    when: "Agent instructions, scripts, hooks, CI, Docker, README and other files a visitor never receives."
    stages: [verify, review_ship]
    deliverables:
      - "nothing beyond a green `npm run verify`"

# ------------------------------------------------------------------------------
# 3b. Track enforcement (enforced: .githooks/commit-msg and the CI job "Track declared")
# ------------------------------------------------------------------------------
# Every commit carries a `Track:` trailer. A chore may not touch the site a visitor receives. A commit
# that touches the files defining or enforcing this workflow also carries `Workflow-Change: <why>`, so
# loosening a check is visible in the history. It cannot judge a stage or stop --no-verify; CI re-runs it.
enforcement:
  # Commits this one contains predate the check. It must be a commit on main.
  baseline: "86af9fbc0ac2345d468f7798783800b832a165f7"
  tracks: [content, fix, chore]
  site_paths: ["index.html", "css/", "js/", "assets/", "contact.php", ".htaccess", "agent.json", "llms.txt", "llms-full.txt", "sitemap.xml", "robots.txt"]
  protected_paths: ["workflow.ai.yml", "scripts/", ".githooks/", ".github/workflows/", "package.json"]

# ------------------------------------------------------------------------------
# 4. Stages (guidance)
# ------------------------------------------------------------------------------
stages:
  - id: plan
    phase: 1
    name: "Plan"
    lead_skills: [owner, agency, pixel, documentation]
    deliverables: ["the plan in the pull request body: what changes on the page, in which language keys, and which machine-readable files follow"]
    guidance: ".agents/rules/review.md"
    description: "Who the change is for, what it claims, and where every claim comes from. A number or client name that cannot be sourced is cut here, not after it ships."

  - id: implement
    phase: 2
    name: "Implement"
    lead_skills: [pixel, code_quality, security_guard, refactor]
    deliverables: []
    guidance: ".agents/rules/frontend.md"
    description: "Markup in index.html with data-i18n keys, both languages in js/i18n.js, styles through the existing tokens in css/design-system.css, no new dependency and no build step."

  - id: verify
    phase: 3
    name: "Verify"
    lead_skills: [qa, debugger]
    deliverables: []
    guidance: ".agents/workflows/verification.md"
    description: "Runs `npm run verify` and reports its actual output, then the manual checks no script makes: both languages, both themes, phone width, keyboard focus, the contact form against a local PHP server."

  - id: review_ship
    phase: 4
    name: "Review and ship"
    lead_skills: [documentation, security_guard, devops]
    deliverables: ["a pull request into main with green CI", "README.md updated when how the site is run or deployed changed"]
    guidance: ".agents/workflows/branching.md"
    description: "Self-review against .agents/rules/review.md, a pull request with a rich description, merge only on green required checks."

# ------------------------------------------------------------------------------
# 5. Skills (enforced: the registry must match .agents/skills/, by scripts/check-workflow.mjs)
# ------------------------------------------------------------------------------
skills:
  directory: ".agents/skills"
  validator: "scripts/validate-skills.mjs"
  claude_code_mirror:
    directory: ".claude/skills"
    generator: "scripts/sync-claude-skills.mjs"
    check: "node scripts/sync-claude-skills.mjs --check"
  registry:
    - name: pixel
      role: "Product Designer & Frontend UX"
      path: ".agents/skills/pixel/SKILL.md"
      scope: "Layout, typography, tokens, both themes, motion, the anti-AI-slop design doctrine. Its MUI specifics do not apply; the site uses css/design-system.css"
    - name: agency
      role: "Marketing & Conversion Critic"
      path: ".agents/skills/agency/SKILL.md"
      scope: "Whether a section earns its place: positioning, clarity of the offer, the path to the contact form"
    - name: owner
      role: "Business Owner Perspective"
      path: ".agents/skills/owner/SKILL.md"
      scope: "Reading the page as a buyer with little time: what they get, what it costs them, what to do next"
    - name: documentation
      role: "Documentation Steward"
      path: ".agents/skills/documentation/SKILL.md"
      scope: "README, AGENTS.md, CLAUDE.md and the machine-readable files (agent.json, llms.txt, llms-full.txt). Its Spec Kit artifact list is optional for a site change"
    - name: code_quality
      role: "Clean Code Reviewer"
      path: ".agents/skills/code_quality/SKILL.md"
      scope: "Readable vanilla JS and PHP. Its Symfony layering sections do not apply"
    - name: refactor
      role: "Refactoring Specialist"
      path: ".agents/skills/refactor/SKILL.md"
      scope: "Behaviour-preserving cleanup of js/ and css/, verified with npm run verify before and after"
    - name: security_guard
      role: "Application Security Auditor"
      path: ".agents/skills/security_guard/SKILL.md"
      scope: "contact.php bot defences and header handling, HTML sinks in js/, secrets never committed. Its JWT and multi-tenant sections do not apply"
    - name: qa
      role: "QA Engineer"
      path: ".agents/skills/qa/SKILL.md"
      scope: "Manual walk-through of both languages, both themes, phone width and the contact form; npm run verify for what a script can check"
    - name: debugger
      role: "Diagnostic Engineer"
      path: ".agents/skills/debugger/SKILL.md"
      scope: "Reading the failing check's own output, reproducing in a browser or with php -S before changing code"
    - name: devops
      role: "Infrastructure & CI Engineer"
      path: ".agents/skills/devops/SKILL.md"
      scope: "Dockerfile, docker-compose.yml, .htaccess, GitHub Actions. FrankenPHP, Coolify and Symfony worker notes do not apply"
    - name: admin
      role: "Inherited: platform super-admin persona"
      path: ".agents/skills/admin/SKILL.md"
      scope: "Inherited from another project; does not apply to this site"
    - name: event_driven
      role: "Inherited: Symfony Messenger and Mercure"
      path: ".agents/skills/event_driven/SKILL.md"
      scope: "Inherited from another project; does not apply to this site"
    - name: migrations
      role: "Inherited: Doctrine migrations"
      path: ".agents/skills/migrations/SKILL.md"
      scope: "Inherited from another project; does not apply to this site"
    - name: sql_master
      role: "Inherited: PostgreSQL and Doctrine"
      path: ".agents/skills/sql_master/SKILL.md"
      scope: "Inherited from another project; does not apply to this site"

# ------------------------------------------------------------------------------
# 6. Gates (enforced; scripts/check-workflow.mjs fails when one is missing from the hook or from CI)
# ------------------------------------------------------------------------------
quality_gates:
  local_hook:
    path: ".githooks/pre-commit"
    commit_msg_path: ".githooks/commit-msg"
    install: "node scripts/install-hooks.mjs"
  pre_commit:
    - name: "Skills Syntax & Security Validation"
      command: "node scripts/validate-skills.mjs"
    - name: "Claude Code Skill Pointer Sync"
      command: "node scripts/sync-claude-skills.mjs --check"
    - name: "Operating Cycle Mirrored Into AGENTS.md"
      command: "node scripts/sync-agent-docs.mjs --check"
    - name: "Workflow Claims Match the Repository"
      command: "node scripts/check-workflow.mjs"
    - name: "Site Integrity (i18n keys, anchors, JSON, sitemap, contact.php)"
      command: "node scripts/check-site.mjs"
  commit_msg:
    - name: "Commit Declares Its Track"
      command: "node scripts/check-track.mjs"

ci:
  workflow: ".github/workflows/ci.yml"
  protected_branch: main
  required_checks:
    - "Verify site"
    - "Track declared"

# ------------------------------------------------------------------------------
# 7. Architectural rules
# ------------------------------------------------------------------------------
# `enforced_by` names what fails when the rule is broken, or says "review" when nothing does. Every
# backticked path in it is checked to exist by scripts/check-workflow.mjs.
architectural_rules:
  - rule: "Every visible string exists in both languages. Text in index.html carries a data-i18n, data-i18n-html, -placeholder, -title or -aria key, and that key exists under both `en` and `pl` in js/i18n.js, as does every key js/ asks for with APSW_I18N.t(). The two dictionaries hold the same set of keys."
    enforced_by: "`scripts/check-site.mjs` (keys used exist in en and pl; en and pl key sets match). A literal with no key at all is caught only in review"
  - rule: "Translated markup uses an *_html key on a data-i18n-html element. The language switcher sets textContent for data-i18n, so a tag in a plain key is shown to the visitor as literal text, and a data-i18n element whose children are markup loses them on the first language switch."
    enforced_by: "`scripts/check-site.mjs` (data-i18n-html keys end in _html; plain keys hold no markup)"
  - rule: "No runtime dependencies and no build step. The files in the repository are the files served. package.json exists only to run checks and declares no dependencies; every script index.html loads is a local file."
    enforced_by: "`scripts/check-site.mjs` (package.json dependencies, external script sources)"
  - rule: "contact.php is the only server code, and it keeps every defence it has: POST only, the two honeypot fields, the two-second time trap on form_rendered_at, the per-IP rate limit, and length validation. The form in index.html keeps the matching fields. It has no CSRF token today, whatever its header comment says: adding one is a fix, and no copy may claim one until it exists."
    enforced_by: "`scripts/check-site.mjs` (php -l, defence markers in contact.php, matching form fields); review for anything new"
  - rule: "No HTML sink receives untrusted input. innerHTML is for strings this repository wrote (translations, static snippets); anything from the network or the visitor goes through textContent. eval, new Function, document.write and string timers are banned in js/."
    enforced_by: "`scripts/check-site.mjs` (banned APIs); review for innerHTML"
  - rule: "Machine-readable files stay valid and agree with the page. agent.json and every JSON-LD block parse as JSON, sitemap.xml is well-formed and lists only absolute https://apsw.pl URLs, and llms.txt starts with its H1. When the offer on the page changes, they change in the same pull request."
    enforced_by: "`scripts/check-site.mjs` (validity); review for agreement"
  - rule: "Every in-page link lands somewhere. Each href=\"#id\" in index.html has a matching id."
    enforced_by: "`scripts/check-site.mjs`"
  - rule: "No invented metrics in new copy. A number, client, certification or outcome added to the page, the JSON-LD or the llms files is one the owner can source. Prefer a plain statement to an impressive one that cannot be defended."
    enforced_by: "review (.agents/rules/review.md)"
