      <h1>Open-source showcase by APSW (Piotr Solarz-Wnęk)</h1>
      <p>This page runs live demos of two MIT-licensed React packages published on npm by APSW. The demos need JavaScript; the facts below do not.</p>
      <h2>apsw-gridwright — React data grid on a headless engine</h2>
      <p>One pipeline for local and remote data, negotiated through data-source capabilities. Demonstrated here: multi-column sorting, typed column filters, search, pagination, inline editing with server-side rejection, CSV/Excel export, 100,000 rows windowed by <code>virtualRows()</code>, an org chart on <code>treeData()</code>, expandable row detail with a nested grid (<code>rowDetail()</code>), a row action menu (<code>rowActions()</code>), column resize, reorder and pinning with the sort, filter and page state kept in the URL (<code>columnLayout()</code>, <code>urlSync()</code>), the five bundled locale packs with a right-to-left switch, keyboard cell navigation with the grid's live region mirrored on screen, and a remote grid on <code>createRestDataSource</code> against a PHP REST backend (<a href="https://apsw.pl/api/people">/api/people</a>).</p>
      <pre>npm install apsw-gridwright</pre>
      <p><a href="https://www.npmjs.com/package/apsw-gridwright">npm</a> · <a href="https://github.com/yaotzin1/apsw-gridwright">GitHub</a> · <a href="https://apsw.pl/gridwright-examples.html">AI agent playbook and canonical recipes</a></p>
      <h2>apsw-gridwright-mui — the same grid with Material UI controls</h2>
      <p>One prop (<code>coreAddons={muiAddons()}</code>) swaps the grid's sort, selection and paging controls for MUI's TableSortLabel, Checkbox and TablePagination, and the grid takes colours, typography, radius and spacing from the MUI theme in context, dark mode included. Demonstrated here: a dashboard strip of Excel-style filters over a MUI grid, three <code>createTheme</code> presets switched live (one with <code>components</code> style overrides on the pager, checkbox and sort label), a single MUI view mixed into the native set (<code>muiSorting()</code>), and the <code>muiTokens(theme)</code> values printed for reuse in your own CSS. Requires apsw-gridwright 0.12+, MUI 7 or 9, React 18 or 19.</p>
      <pre>npm install apsw-gridwright apsw-gridwright-mui</pre>
      <p><a href="https://www.npmjs.com/package/apsw-gridwright-mui">npm</a> · <a href="https://github.com/yaotzin1/apsw-gridwright/tree/main/packages/mui">GitHub</a></p>
      <h2>apsw-mui-excel-filter — Excel-style filter dropdown for Material UI</h2>
      <p>Type to narrow the list, untick what you want gone, confirm with OK. Filtering is subtractive; an unfiltered field emits an empty array, so its parameter leaves the query string. Works with MUI 5, 6 and 7 and React 17, 18 and 19. Demonstrated here as three dropdowns filtering a 300-row apsw-gridwright grid.</p>
      <pre>npm install apsw-mui-excel-filter</pre>
      <p><a href="https://www.npmjs.com/package/apsw-mui-excel-filter">npm</a> · <a href="https://github.com/yaotzin1/apsw-mui-excel-filter">GitHub</a></p>
